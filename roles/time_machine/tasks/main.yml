---
# Network Time Machine destination over SMB. The password isn't handled
# here at all: tmutil setdestination doesn't reliably pull it from any
# Keychain (login or System) when run as root, so the destination has to
# be added once, manually, outside Ansible -- see the README. Once it's
# been added, `tmutil destinationinfo` already lists it and this role just
# confirms it/enables backups on every subsequent run.
- name: Check current Time Machine destinations
  ansible.builtin.command: tmutil destinationinfo
  register: tm_destinations
  changed_when: false
  failed_when: false

- name: Add network Time Machine destination
  become: true
  ansible.builtin.command: >-
    tmutil setdestination -a
    smb://{{ time_machine_smb_user }}@{{ time_machine_smb_host }}/{{ time_machine_smb_share }}
  when: time_machine_smb_share not in tm_destinations.stdout

- name: Ensure Time Machine backups are enabled
  become: true
  ansible.builtin.command: tmutil enable
  changed_when: false
