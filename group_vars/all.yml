---
# Homebrew taps to enable. Leave empty unless a package you need lives in a
# third-party tap.
homebrew_taps: []

# Command-line formulae to keep installed and up to date.
homebrew_formulae:
  - ansible
  - chezmoi
  - zsh
  - tmux
  - herdr
  - wormhole-william
  - tailscale
  - gnupg
  - docker
  - colima
  - docker-credential-helper

# GUI apps installed via Homebrew Cask.
#
# `install_options: [adopt]` tells Homebrew to take over an app that's
# already sitting in /Applications (e.g. downloaded manually) instead of
# refusing to install because it's already there. It's only needed the
# first time Homebrew adopts a given app.
homebrew_casks:
  - name: brave-browser
    install_options: [adopt]
  - name: claude
  - name: hammerspoon
  - name: ghostty
  - name: emacs-app
  - name: iterm2

# Note: Claude Code (the CLI) is intentionally NOT managed here -- see
# roles/claude_code instead. It's installed via its own native
# installer/self-updater (~/.local/bin/claude) by choice, rather than the
# `claude-code` Homebrew cask, so it can auto-update in the background.

# Run `brew cleanup` after installing/upgrading to remove old versions and
# cached downloads.
homebrew_cleanup: true

# Run `brew autoremove` after cleanup to remove formulae that were only
# pulled in as a dependency (e.g. an old python@3.x left behind after
# something it backed bumped its pinned version) and are no longer needed
# by anything installed. `brew cleanup` does not do this on its own.
homebrew_autoremove: true

# Git identity. ~/.gitconfig itself is no longer set here -- roles/dotfiles
# (chezmoi) fully owns it now. These two are still used to: generate this
# machine's GPG signing key (roles/gpg_key) with a matching identity, and
# seed chezmoi's "email" template prompt so the dotfiles-managed gitconfig
# picks it up on `chezmoi init` without an interactive prompt.
git_user_name: "Daniel Midwood"
git_user_email: "dan@danmidwood.com"

# SSH key used for git/general auth. Only generated if it doesn't already
# exist -- re-running the playbook won't touch or overwrite it.
ssh_key_type: ed25519
ssh_key_path: "{{ ansible_env.HOME }}/.ssh/id_{{ ssh_key_type }}"
ssh_key_comment: "{{ git_user_email }}"

# This machine's SSD is failing and sleep/standby/hibernation-related disk
# activity triggers problems, so sleep is disabled system-wide as a
# workaround. Trades battery life/heat for stability -- keep the lid open
# or plugged in.
pmset_settings:
  sleep: 0
  powernap: 0
  standby: 0
  hibernatemode: 0

# Passwordless sudo for daniel, so tools/scripts (including this playbook)
# don't need a password prompt to run pmset etc. Set up manually on this
# machine on 2026-08-29; captured here so a future install reproduces it.
# Trade-off: anything running as this user can gain root without a password
# prompt as a checkpoint.
sudoers_nopasswd_user: daniel

# Dotfiles, managed by chezmoi. Private repo -- see roles/dotfiles and the
# README for the one-time SSH key step this needs on a new machine.
dotfiles_repo: git@github.com:danmidwood/dotfiles.git
dotfiles_dest: "{{ ansible_env.HOME }}/repos/dotfiles"

# Network Time Machine destination (SMB share). No password lives here --
# it relies on a matching credential already saved in this user's Keychain
# (see roles/time_machine).
time_machine_smb_user: daniel
time_machine_smb_host: xps
time_machine_smb_share: mbp_13_2017

# Optional macOS system preferences (`defaults write` equivalents), applied
# via community.general.osx_defaults. Left empty by default since these are
# personal taste and easy to lose track of -- add entries as you decide you
# want them. Example:
#
# macos_defaults:
#   - domain: NSGlobalDomain
#     key: AppleShowAllExtensions
#     type: bool
#     value: true
#   - domain: com.apple.finder
#     key: AppleShowAllFiles
#     type: bool
#     value: true
#     restart: cfprefsd
macos_defaults: []
